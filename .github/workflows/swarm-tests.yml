name: Swarm offline tests

on:
  push:
    branches: [dev]
    paths:
      - 'swarm/**'
      - 'tests/**'
      - '.github/workflows/swarm-tests.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'swarm/**'
      - 'tests/**'
      - '.github/workflows/swarm-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline swarm tests
        run: python -m unittest discover -s tests -v
